# This is a template — copy this whole `examples/my-first-skill/` directory,
# rename it, and edit the fields below to describe your own skill.
#
# The manifest is DVAS's only source of truth for what your skill is
# ALLOWED to do. Anything your skill actually does at runtime that isn't
# covered here is capability drift — exactly what DVAS exists to catch.
# Keep this as narrow as your skill's real job actually requires.

name: changelog-summarizer   # <- your skill's name
version: "0.1"                # <- bump this on every release; DVAS diffs across versions (see AST02 labs)

purpose:
  - read the local changelog                # <- one bullet per thing your skill is FOR
  - summarize recent entries for the user    #    (shows up in `skillfence inspect`)

capabilities:
  filesystem:
    read:
      - "${workspace}/CHANGELOG.md"    # <- exact paths or globs your skill legitimately reads
    write: []                          # <- anything it writes, same idea — empty if none
  process:
    execute: []                        # <- executables it's allowed to run — empty if none
  network:
    enabled: false                     # <- true only if it needs the network at all
    domains: []                        # <- if enabled, the EXACT domains it's allowed to reach
  secrets:
    access: false                      # <- true only if it needs credentials/secrets
