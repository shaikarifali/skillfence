name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # SkillFence-Lab is a separate repo (github.com/shaikarifali/SkillFence-Lab) this runtime
      # is benchmarked against — the lab-driven tests skip gracefully when
      # it's absent, but CI should actually run them, not just confirm they
      # skip cleanly.
      - name: Clone SkillFence-Lab
        run: git clone --depth 1 https://github.com/shaikarifali/SkillFence-Lab ../SkillFence-Lab

      - name: Install
        run: pip install -e .

      # Generated, not committed -- deterministic from the script, so
      # nothing to keep in sync. Built before pytest so
      # tests/test_adversarial_corpus.py doesn't just skip in CI.
      - name: Build adversarial benchmark corpus
        run: python3 scripts/build_adversarial_corpus.py

      - name: pytest
        run: python -m pytest -q

      - name: Benchmark — SkillFence-Lab (28/28 malicious detected, 0/3 false positives expected)
        run: skillfence bench ../SkillFence-Lab

      - name: Benchmark — adversarial/evasion corpus (12/12 detected, 0/5 false positives expected)
        run: skillfence bench benchmarks/adversarial
