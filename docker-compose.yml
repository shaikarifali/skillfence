# `network_mode: none` is defense-in-depth on top of the fact that the
# runtime never grants a wrapped skill raw network access in the first
# place -- even a bug in that guarantee can't reach the network from
# inside this container.
#
# Mount a lab suite (e.g. a clone of https://github.com/shaikarifali/SkillFence-Lab)
# at ./SkillFence-Lab to run it against the containerized tool:
#   docker compose run --rm skillfence run SkillFence-Lab/AST05/external-doc-injection --decision reject
#   docker compose run --rm skillfence bench SkillFence-Lab
services:
  skillfence:
    build: .
    image: skillfence:latest
    network_mode: none
    stdin_open: true
    tty: true
    volumes:
      - ./SkillFence-Lab:/app/SkillFence-Lab
